name: Tests
on: [push, pull_request]
jobs:
  unit-and-galsim:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: pytest -ra
      - run: python -m build
  stellar-physics:
    if: ${{ !contains(github.event.head_commit.message, '[skip stellar]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPS_HOME: /tmp/chromorph-fsps
      CHROMORPH_FSPS_TESTS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public FSPS reference libraries
        run: git clone --depth 1 https://github.com/cconroy20/fsps.git "$SPS_HOME"
      - run: python -m pip install -e '.[test,stellar]'
      - run: pytest -ra tests/test_fsps_physics.py tests/test_constant_fsps_live.py
  hst-photometry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHROMORPH_HST_TESTS: '1'
      PYSYN_CDBS: https://ssb.stsci.edu/trds/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,stellar]'
      - run: pytest -ra tests/test_hst_photometry.py tests/test_photometry_operator.py
  stellar-hst-and-mismatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPS_HOME: /tmp/chromorph-fsps
      PYSYN_CDBS: https://ssb.stsci.edu/trds/
      CHROMORPH_FSPS_TESTS: '1'
      CHROMORPH_STELLAR_TESTS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git clone --depth 1 https://github.com/cconroy20/fsps.git "$SPS_HOME"
      - run: python -m pip install -e '.[test,stellar]'
      - run: pytest -ra --durations=5 tests/test_stellar_integration.py tests/test_fsps_physics.py::test_live_out_of_family_nebular_spectrum_is_detected
