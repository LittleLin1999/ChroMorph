[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chromorph"
version = "0.1.0"
description = "Joint PSF-convolved multi-band morphology with independent component SEDs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "astropy>=5.3", "galsim>=2.5", "PyYAML>=6", "matplotlib>=3.7"]

[project.optional-dependencies]
stellar = ["fsps>=0.4.7", "stsynphot>=1.4", "synphot>=1.3", "dust-extinction>=1.3"]
bayes = ["emcee>=3.1"]
polychord = ["mpi4py>=3.1"]
test = ["pytest>=7", "build>=1"]

[project.scripts]
chromorph = "chromorph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires optional stellar libraries and local calibration data"]
